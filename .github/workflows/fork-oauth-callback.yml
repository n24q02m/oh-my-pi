name: Fork oauth-callback

on:
  push:
    branches: [fix/oauth-callback-port-conflict]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  oauth_callback_contract:
    name: OAuth callback listener contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install dependencies
        run: bun install
      - name: Run OAuth callback tests
        env:
          PI_TEST_RUNTIME: "1"
          BUN_JSC_useConcurrentGC: "0"
          BUN_JSC_numberOfGCMarkers: "1"
        run: |
          bun test packages/ai/test/callback-server-port-fallback.test.ts packages/ai/test/callback-server-dual-stack.test.ts packages/ai/test/callback-server-security.test.ts packages/ai/test/callback-server-launch-route.test.ts packages/ai/test/callback-server-manual-input.test.ts packages/ai/test/anthropic-oauth.test.ts packages/coding-agent/test/mcp-oauth-flow.test.ts packages/coding-agent/test/oauth-manual-input.test.ts
