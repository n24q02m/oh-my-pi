name: Fork crash-safe-session-lifecycle

on:
  push:
    branches: [fix/crash-safe-session-replay]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lifecycle_contract:
    name: Crash-safe lifecycle contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install dependencies
        run: bun install
      - name: Install release native addons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/natives/native
          tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
          echo "Fetching $tarball"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" packages/natives/native/
          cp "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" packages/natives/native/
      - name: Check TypeScript types
        run: bunx tsgo -p packages/coding-agent/tsconfig.json --noEmit
      - name: Run lifecycle diagnostics tests
        env:
          PI_TEST_RUNTIME: "1"
          BUN_JSC_useConcurrentGC: "0"
          BUN_JSC_numberOfGCMarkers: "1"
        run: |
          bun test packages/coding-agent/test/session-exit-diagnostics.test.ts packages/coding-agent/test/session-sentinel.test.ts packages/coding-agent/test/session-liveness.test.ts
